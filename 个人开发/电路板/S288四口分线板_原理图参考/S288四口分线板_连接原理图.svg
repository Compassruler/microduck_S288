<text x="105" y="1092.94" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#805a12">画板与接线说明</text>
<text x="105" y="1136.36" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#172635">1. 四口共用同一套舵机电源；本图经 J1 供电，不再并接第二路电源。</text>
<text x="105" y="1177.36" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#172635">2. J1 的 VCC / GND 承担三组总电流；所有插座、线束、铜箔载流能力均需核对。</text>
<text x="105" y="1218.36" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#172635">3. 核对符号针号、封装焊盘和实际线束；6 Mbps 分支通信与电容效果尚需实测。</text>
<text x="80" y="1293.64" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#536575">针序依据：宇树《无刷数字舵机 J288/S288 使用手册》第 3 页。</text>
<text x="80" y="1337.64" text-anchor="start" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#536575">本图是连接原理参考，不是已验证的 PCB 生产文件；电容建议值可按实测调整。</text>
<text x="2120" y="1339.78" text-anchor="end" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#536575">1 / 1</text>
